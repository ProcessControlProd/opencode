name: build-fork

# Build the opencode binary (with the reverse-proxy base-path patch) and publish
# it as a GitHub Release on THIS fork. Uses only the built-in GITHUB_TOKEN — no
# upstream secrets (npm / Azure / Apple signing) needed. Produces the Linux
# x64 + arm64 binaries used by the OEM odoo image (replacing `opencode.ai/install`).
#
# Run it from the Actions tab ("build-fork" -> Run workflow). Requires Actions to
# be enabled on the fork (Settings -> Actions -> Allow all actions).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/ref to build (production-based feature branch)"
        default: feat/reverse-proxy-base-path-prod
      tag:
        description: "Release tag (auto = v<version> from package.json)"
        default: auto
      version:
        description: "Version stamp (auto = read packages/opencode/package.json)"
        default: auto

permissions:
  contents: write

jobs:
  build:
    # GitHub-hosted Linux runner. build.ts cross-compiles every target from a
    # single host, so this produces BOTH linux-x64 and linux-arm64 (bun
    # cross-compile + per-arch native deps) — the runner's own arch is irrelevant.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (${{ inputs.ref }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install

      # Resolve the version stamp. "auto" reads the branch's declared version
      # (packages/opencode/package.json) so the binary reports the real opencode
      # version (e.g. 1.17.6) instead of a 0.0.0-* placeholder.
      - name: Resolve version
        run: |
          VERSION='${{ inputs.version }}'
          if [ "$VERSION" = "auto" ]; then
            VERSION=$(jq -r .version packages/opencode/package.json)
          fi
          echo "Resolved OPENCODE_VERSION=$VERSION"
          echo "OPENCODE_VERSION=$VERSION" >> "$GITHUB_ENV"

      # build.ts cross-compiles every target on this single Linux runner, builds
      # packages/app (vite base "./") and embeds it as opencode-web-ui.gen.ts.
      # OPENCODE_CHANNEL=prod => no "DEV" badge + classic layout default
      # (newLayoutDesignsDefault is `channel !== "prod"`), matching the desktop app.
      # A smoke test (`opencode --version`) runs for the native linux-x64 binary.
      - name: Build binaries
        run: bun ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}
          OPENCODE_CHANNEL: prod

      - name: Stage linux binaries
        run: |
          mkdir -p out
          for d in packages/opencode/dist/opencode-linux-*; do
            [ -f "$d/bin/opencode" ] || continue
            cp "$d/bin/opencode" "out/$(basename "$d")"
          done
          echo "=== staged binaries ==="
          ls -la out

      - name: Publish to fork release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ inputs.tag }}'
          # "auto" => tag the release with the opencode version (e.g. v1.17.7).
          if [ "$TAG" = "auto" ]; then
            TAG="v$OPENCODE_VERSION"
          fi
          echo "Publishing release tag: $TAG"
          # Recreate the release so re-running the build for a version republishes
          # fresh binaries under the same version tag. --latest keeps a stable
          # /releases/latest/download/ URL for consumers (the OEM odoo image).
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ inputs.ref }}" \
            --latest \
            --title "opencode $TAG" \
            --notes "opencode binary with reverse-proxy base-path support (--base-path / OPENCODE_BASE_PATH). Linux x64 + arm64. Built from ${{ inputs.ref }}."
